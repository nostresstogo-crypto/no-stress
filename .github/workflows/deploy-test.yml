name: 🧪 Deploy — Test

on:
  push:
    branches: [test]

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  # ─── BUILD ───────────────────────────────────────────────────────────────
  build:
    name: Build all artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # ── API ──────────────────────────────────────────────────────────────
      - name: Build api-server
        run: pnpm --filter @workspace/api-server run build

      - name: Stage API release
        run: |
          STAGE="$RUNNER_TEMP/api-release"
          mkdir -p "$STAGE/drizzle"
          cp -r artifacts/api-server/dist "$STAGE/"
          cp deploy/release-package.json "$STAGE/package.json"
          cp -r lib/db/. "$STAGE/drizzle/"
          # drizzle-kit absent du package.json si déjà présent → fallback
          node -e "
            const fs = require('fs');
            const path = '$STAGE/drizzle/package.json';
            const p = JSON.parse(fs.readFileSync(path, 'utf8'));
            p.devDependencies = p.devDependencies || {};
            p.devDependencies['drizzle-kit'] = p.devDependencies['drizzle-kit'] || '^0.31.9';
            fs.writeFileSync(path, JSON.stringify(p, null, 2));
          "
          tar -C "$STAGE" -czf api-release.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: api-release
          path: api-release.tar.gz
          retention-days: 1

      # ── Admin ─────────────────────────────────────────────────────────────
      - name: Build nostress-admin
        env:
          NODE_ENV: production
          VITE_API_BASE: https://test.api.no-stress.net/api
        run: pnpm --filter @workspace/nostress-admin run build

      - uses: actions/upload-artifact@v4
        with:
          name: admin-release
          path: artifacts/nostress-admin/dist/public/
          retention-days: 1

      # ── Web ───────────────────────────────────────────────────────────────
      - name: Build nostress-web
        env:
          REACT_APP_API_BASE: https://test.api.no-stress.net/api
          SKIP_PREFLIGHT_CHECK: "true"
          DISABLE_ESLINT_PLUGIN: "true"
          TSC_COMPILE_ON_ERROR: "true"
          GENERATE_SOURCEMAP: "false"
          CI: "false"
        run: pnpm --filter @workspace/nostress-web run build:prod

      - uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: artifacts/nostress-web/build/
          retention-days: 1

  # ─── DEPLOY API ──────────────────────────────────────────────────────────
  deploy-api:
    name: API → test.api.no-stress.net
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: api-release

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload & activer la release
        env:
          SHA: ${{ github.sha }}
        run: |
          REMOTE_DIR="/var/www/nostress-test-api/releases/$SHA"
          ssh -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "mkdir -p $REMOTE_DIR"
          scp -P "${{ secrets.VPS_PORT }}" api-release.tar.gz "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:$REMOTE_DIR/"
          scp -P "${{ secrets.VPS_PORT }}" deploy/test/release-api.sh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:$REMOTE_DIR/release.sh"
          ssh -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "
            cd $REMOTE_DIR && tar -xzf api-release.tar.gz && rm api-release.tar.gz
            chmod +x release.sh && ./release.sh $SHA
          "

      - name: Smoke test
        run: |
          for i in {1..15}; do
            sleep 2
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://test.api.no-stress.net/api/health)
            [ "$STATUS" = "200" ] && echo "✅ OK" && exit 0
            echo "Tentative $i/15 — status $STATUS"
          done
          echo "❌ Health check échoué" && exit 1

  # ─── DEPLOY ADMIN ────────────────────────────────────────────────────────
  deploy-admin:
    name: Admin → test.admin.no-stress.net
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: admin-release
          path: admin-release/

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload & activer la release
        env:
          SHA: ${{ github.sha }}
        run: |
          REMOTE_DIR="/var/www/nostress-test-admin/releases/$SHA"
          ssh -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "mkdir -p $REMOTE_DIR"
          rsync -az --delete -e "ssh -p ${{ secrets.VPS_PORT }}" \
            admin-release/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:$REMOTE_DIR/"
          ssh -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "
            ln -sfn $REMOTE_DIR /var/www/nostress-test-admin/current
            sudo systemctl reload nginx
          "

      - name: Smoke test
        run: |
          sleep 3
          curl -fsS "https://test.admin.no-stress.net/" -o /dev/null \
            && echo "✅ test.admin.no-stress.net répond" \
            || (echo "❌ Échec" && exit 1)

  # ─── DEPLOY WEB ──────────────────────────────────────────────────────────
  deploy-web:
    name: Web → test.no-stress.net
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-release
          path: web-release/

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload & activer la release
        env:
          SHA: ${{ github.sha }}
        run: |
          REMOTE_DIR="/var/www/nostress-test-web/releases/$SHA"
          ssh -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "mkdir -p $REMOTE_DIR"
          rsync -az --delete -e "ssh -p ${{ secrets.VPS_PORT }}" \
            web-release/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:$REMOTE_DIR/"
          ssh -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "
            ln -sfn $REMOTE_DIR /var/www/nostress-test-web/current
            sudo systemctl reload nginx
          "

      - name: Smoke test
        run: |
          sleep 3
          curl -fsS "https://test.no-stress.net/" -o /dev/null \
            && echo "✅ test.no-stress.net répond" \
            || (echo "❌ Échec" && exit 1)
